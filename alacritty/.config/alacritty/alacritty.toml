# ~/.config/alacritty/alacritty.toml

[window]
opacity = 0.75
decorations = "none"

[font]
size = 14
builtin_box_drawing = true

[font.normal]
family = "Fira Code"
style = "Bold"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[font.bold_italic]
family = "Fira Code"
style = "Bold Italic"

[colors.primary]
background = "#1b1b1b"
foreground = "#ebdbb2"

[colors.cursor]
text = "#1b1b1b"
cursor = "#ebdbb2"

[colors.selection]
text = "#ebdbb2"
background = "#665c54"

[colors.normal]
black = "#1b1b1b"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
